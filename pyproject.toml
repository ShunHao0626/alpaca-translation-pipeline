[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alpaca-translation-pipeline"
version = "0.1.0"
description = "Detect, translate, and merge Chinese content in Alpaca-format datasets."
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "ShunHao0626" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Topic :: Text Processing :: Linguistic",
]

[project.optional-dependencies]
google = [
  "deep-translator>=1.11,<2",
]
dev = [
  "pytest>=7.0",
]

[project.scripts]
alpaca-translate = "alpaca_translation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
